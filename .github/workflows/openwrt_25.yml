name: Build NipoVPN OpenWrt BCM2711

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      OPENWRT_VERSION: "25.12.4"
      OPENWRT_TARGET: "bcm27xx"
      OPENWRT_SUBTARGET: "bcm2711"
      OPENWRT_SDK_FILE: "openwrt-sdk-25.12.4-bcm27xx-bcm2711_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            curl \
            git \
            rsync \
            zstd \
            file \
            unzip \
            python3

      - name: Download OpenWrt SDK
        run: |

          set -eux

          SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}/${OPENWRT_SDK_FILE}"

          curl \
            -L \
            --retry 5 \
            "$SDK_URL" \
            -o sdk.tar.zst

          tar --zstd -xf sdk.tar.zst

          SDK_DIR=$(find . -maxdepth 1 -type d -name "openwrt-sdk-*" | head -n1)

          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV

      - name: Create OpenWrt package
        run: |

          set -eux

          cd "$SDK_DIR"

          mkdir -p package/nipovpn

          cat > package/nipovpn/Makefile <<'EOF'
          include $(TOPDIR)/rules.mk
          
          PKG_NAME:=nipovpn
          PKG_VERSION:=git
          PKG_RELEASE:=1
          
          PKG_SOURCE_PROTO:=git
          PKG_SOURCE_URL:=https://github.com/MortezaBashsiz/nipovpn.git
          PKG_SOURCE_VERSION:=HEAD
          PKG_MIRROR_HASH:=skip
          
          PKG_BUILD_PARALLEL:=1
          
          include $(INCLUDE_DIR)/package.mk
          include $(INCLUDE_DIR)/cmake.mk
          
          CMAKE_BINARY_SUBDIR:=build
          
          CMAKE_OPTIONS += \
                  -DCMAKE_BUILD_TYPE=Release
          
          define Package/nipovpn
            SECTION:=net
            CATEGORY:=Network
            TITLE:=NipoVPN
            DEPENDS:= \
                  +libopenssl \
                  +libboost-system \
                  +libboost-regex \
                  +libyaml-cpp
          endef
          
          define Package/nipovpn/description
           NipoVPN package
          endef
          
          define Package/nipovpn/install
          	$(INSTALL_DIR) $(1)/usr/bin
          	$(INSTALL_BIN) \
          		$(PKG_BUILD_DIR)/build/core/nipovpn \
          		$(1)/usr/bin/
          endef
          
          $(eval $(call BuildPackage,nipovpn))
          EOF

          ./scripts/feeds update -a

          ./scripts/feeds install -a

          make defconfig

      - name: Build package
        run: |

          set -eux

          cd "$SDK_DIR"

          make package/nipovpn/clean

          make package/nipovpn/compile \
            -j$(nproc) \
            V=sc

      - name: Show output files
        run: |

          find "$SDK_DIR/bin" \
            -type f \
            \( \
              -name "*.ipk" \
              -o -name "Packages*" \
            \)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4

        with:

          name: nipovpn-openwrt-bcm2711

          path: |
            ${{ env.SDK_DIR }}/bin/packages/**/*.ipk
            ${{ env.SDK_DIR }}/bin/packages/**/Packages*

